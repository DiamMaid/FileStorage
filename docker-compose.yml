services:
  filestorage:
    build:
      context: .
      dockerfile: FileStorage/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Jwt__Secret=${JWT_SECRET}
    volumes:
      - filestorage-data:/app/FileStorage

volumes:
  filestorage-data: